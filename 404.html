<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>404 — PAGE NOT FOUND | AKI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/profile/style.css">
  <style>
    .not-found-page { min-height:100vh; display:grid; place-items:center; padding:28px; text-align:center; }
    .not-found-content { position:relative; z-index:2; width:min(560px,100%); padding:52px 28px; border:1px solid rgba(255,255,255,.16); border-radius:20px; background:rgba(255,255,255,.07); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); box-shadow:0 24px 70px rgba(0,0,0,.24); }
    .not-found-code { color:rgba(255,255,255,.22)!important; font:700 clamp(76px,18vw,136px)/.9 "Space Grotesk",sans-serif; letter-spacing:-.09em; }
    .not-found-content h1 { margin:20px 0 10px; color:#fff!important; font:600 clamp(22px,5vw,32px)/1.1 "Space Grotesk",sans-serif; letter-spacing:-1px; }
    .not-found-content p { max-width:360px; margin:0 auto; color:rgba(255,255,255,.58)!important; font-size:11px; line-height:1.9; }
    .not-found-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:27px; }
    .not-found-actions a { display:inline-flex; align-items:center; gap:12px; padding:13px 17px; border:1px solid rgba(255,255,255,.24); border-radius:8px; background:rgba(255,255,255,.06); color:#fff!important; font:700 9px "Space Grotesk",sans-serif; letter-spacing:1.2px; }
    .not-found-actions a:hover { background:rgba(255,255,255,.15); }
    .not-found-mark { margin-top:28px; color:rgba(255,255,255,.3)!important; font:700 10px "Space Grotesk",sans-serif; letter-spacing:3px; }
  </style>
</head>
<body class="not-found-page">
  <main class="not-found-content">
    <div class="not-found-code">404</div>
    <h1>THIS PAGE DRIFTED AWAY.</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back to the Aki profile.</p>
    <div class="not-found-actions">
      <a href="/profile/">BACK TO HOME <span>↗</span></a>
      <a href="/profile/#projects">EXPLORE PROJECTS <span>↗</span></a>
    </div>
    <div class="not-found-mark">A. / BLACK AURA</div>
  </main>
</body>
</html>
